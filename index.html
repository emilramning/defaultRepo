<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loading...</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            font-family: Arial, sans-serif;
        }

        #video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        #start {
            position: fixed;
            inset: 0;
            z-index: 10;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #000;
        }

        #start button {
            padding: 18px 35px;

            border: none;
            border-radius: 10px;

            background: white;
            color: black;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            transition: transform 0.2s;
        }

        #start button:hover {
            transform: scale(1.05);
        }

        #loading {
            position: fixed;
            inset: 0;

            display: none;
            align-items: center;
            justify-content: center;

            background: #000;
            color: white;

            z-index: 20;

            font-size: 18px;
        }

        .loader {
            text-align: center;
        }

        .bar {
            width: 220px;
            height: 5px;

            background: #222;

            margin-top: 15px;

            overflow: hidden;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: white;

            animation: load 1.5s forwards;
        }

        @keyframes load {
            to {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Rickroll video -->
    <iframe
        id="video"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=0&controls=1&rel=0&modestbranding=1"
        allow="autoplay; encrypted-media; fullscreen"
        allowfullscreen>
    </iframe>

    <!-- Autoplay fallback -->
    <div id="start">

        <button onclick="startRickroll()">
            Continue
        </button>

    </div>

    <!-- Fake loading screen -->
    <div id="loading">

        <div class="loader">

            <div>
                Loading...
            </div>

            <div class="bar">
                <div class="progress"></div>
            </div>

        </div>

    </div>

    <script>

        function startRickroll() {

            document.getElementById("start").style.display = "none";

            document.getElementById("loading").style.display = "flex";

            setTimeout(() => {

                document.getElementById("loading").style.display = "none";

                const video = document.getElementById("video");

                video.src =
                    "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&controls=1&rel=0&modestbranding=1";

            }, 1500);

        }

    </script>

</body>
</html>
